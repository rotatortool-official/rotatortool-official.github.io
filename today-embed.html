*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;}
a{color:var(--link);}

.title{font-size:18px;font-weight:700;margin-top:2px;}
.sub{font-size:12px;color:var(--muted);}
.seg{display:inline-flex;border:1px solid var(--bdr2);border-radius:7px;overflow:hidden;}
.seg button{font-family:inherit;font-weight:700;font-size:11px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.05em;background:transparent;color:var(--muted);border:0;padding:7px 11px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--bdr2);}
.seg button.on{background:var(--tab);color:var(--text);}
.grp{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:16px 2px 8px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 13px 10px;}
.k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-right:30px;}
.v{font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.u{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;}
.d{font-weight:700;font-size:11.5px;line-height:1.3;font-variant-numeric:tabular-nums;margin-top:2px;}
.d.up{color:var(--green);} .d.dn{color:var(--red);} .d.flat{color:var(--muted);}
.spark{display:block;width:100%;height:28px;margin:7px 0 4px;}
.note{font-size:11.5px;color:var(--muted);line-height:1.4;}
.src{font-size:10.5px;color:var(--faint);margin-top:6px;}
.src a{color:inherit;}
.emb{position:absolute;top:10px;right:11px;width:20px;height:20px;opacity:.65;pointer-events:none;}
.emb.flag{width:22px;height:15px;top:12px;}
.emb svg{display:block;width:100%;height:100%;}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--bdr);}
.foot .meta{font-size:11.5px;color:var(--faint);}
.cta{display:flex;gap:8px;flex-wrap:wrap;}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:8px;border:1px solid var(--bdr2);color:var(--text);background:var(--card);}
.btn.main{background:var(--green);border-color:var(--green);color:#04130e;}
.msg{padding:28px 10px;text-align:center;color:var(--muted);}
@media(max-width:420px){body{padding:10px;}.grid{grid-template-columns:repeat(2,minmax(0,1fr));}.v{font-size:17px;}.tile{padding:10px 11px 9px;}}

    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
    var a = iso.split('-'), M = MK ? MON_MK : MON_EN;
    return monthly ? M[+a[1] - 1] + ' ' + a[0] : (+a[2]) + ' ' + M[+a[1] - 1];
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ── Emblems: the site's drawings (js/data-loaders.js _bfEmbSvg), so a
     tile here and on Rotator look like the same thing. */
  var ING = { gold: ['#e3b23c', '#a87a12'], silver: ['#b0b8c0', '#5d666e'], copper: ['#c87a4a', '#8a4a26'], aluminum: ['#98a3ad', '#55606a'] };
  function star(cx, cy, r) { var p = []; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; p.push((cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2)); } return '<polygon points="' + p.join(' ') + '" fill="#ffcc00"/>'; }
  function ingot(x, y, w, c) { return '<polygon points="' + (x + 2.5) + ' ' + y + ' ' + (x + w - 2.5) + ' ' + y + ' ' + (x + w) + ' ' + (y + 6) + ' ' + x + ' ' + (y + 6) + '" fill="' + c[0] + '" stroke="' + c[1] + '" stroke-width=".8" stroke-linejoin="round"/><line x1="' + (x + 3.2) + '" y1="' + (y + 1.4) + '" x2="' + (x + w - 3.2) + '" y2="' + (y + 1.4) + '" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/>'; }
  function emblem(id) {
    var flag = id === 'us' || id === 'eu' || id === 'jp', s = '', i;
    if (id === 'us') { for (i = 0; i < 7; i++) s += '<rect y="' + (i * 20 / 7).toFixed(3) + '" width="30" height="' + (20 / 7).toFixed(3) + '" fill="' + (i % 2 ? '#fff' : '#b22234') + '"/>'; s += '<rect width="13" height="11.43" fill="#3c3b6e"/>'; for (var r = 0; r < 3; r++) for (var q2 = 0; q2 < 4; q2++) s += '<circle cx="' + (2 + q2 * 3) + '" cy="' + (2 + r * 3.4) + '" r=".7" fill="#fff"/>'; }
    else if (id === 'eu') { s = '<rect width="30" height="20" fill="#003399"/>'; for (i = 0; i < 12; i++) { var a = i * Math.PI / 6; s += star(15 + 6 * Math.cos(a), 10 + 6 * Math.sin(a), 1.25); } }
    else if (id === 'jp') s = '<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>';
    else if (ING[id]) s = ingot(1, 15, 11, ING[id]) + ingot(12, 15, 11, ING[id]) + ingot(6.5, 8.6, 11, ING[id]);
    else if (id === 'barrel' || id === 'diesel') { var bx = id === 'diesel' ? 2 : 5; s = '<rect x="' + bx + '" y="3" width="14" height="18" rx="3" fill="#4a5b65"/><rect x="' + bx + '" y="7.6" width="14" height="1.3" fill="#7d8f99"/><rect x="' + bx + '" y="15.1" width="14" height="1.3" fill="#7d8f99"/>'; if (id === 'diesel') s += '<path d="M19.5 8.5c0 0-3.5 4.4-3.5 6.8a3.5 3.5 0 0 0 7 0c0-2.4-3.5-6.8-3.5-6.8z" fill="#d49a12"/>'; }
    else if (id === 'flame') s = '<path d="M12 2c.8 3.6 6 6 6 12a6 6 0 0 1-12 0c0-2.9 1.7-4.9 3-6.6.1 1.9 1 3 2.1 3.2C11 7.7 10.6 5 12 2z" fill="#2f80ed"/><path d="M12 12.2c.6 1.6 2.6 2.6 2.6 4.6a2.6 2.6 0 0 1-5.2 0c0-1.6 1.6-2.6 2.6-4.6z" fill="#9cc7ff"/>';
    else if (id === 'bolt') s = '<polygon points="13.5 1.5 4 13.5 11 13.5 9.5 22.5 20 9.5 13 9.5" fill="#f2b705" stroke="#b98600" stroke-width=".6" stroke-linejoin="round"/>';
    else if (id === 'btc' || id === 'usd' || id === 'stable') { var f = id === 'btc' ? '#f7931a' : id === 'stable' ? '#26a17b' : 'none'; s = '<circle cx="12" cy="12" r="10" fill="' + f + '"' + (id === 'usd' ? ' stroke="#2e7d32" stroke-width="1.8"' : '') + '/>'; s += id === 'btc' ? '<path d="M10 5.5v13M13 5.5v13" stroke="#fff" stroke-width="1.3"/><text x="12.3" y="16.6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">B</text>' : '<text x="12" y="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="' + (id === 'usd' ? '#2e7d32' : '#fff') + '">$</text>'; }
    else if (id === 'lock') s = '<path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#7b61ff" stroke-width="2.2"/><rect x="4.5" y="10.5" width="15" height="11" rx="2.2" fill="#7b61ff"/><circle cx="12" cy="15.4" r="1.6" fill="#fff"/>';
    else if (id === 'eth') s = '<polygon points="12 1.5 5 12.3 12 16.4 19 12.3" fill="#627eea"/><polygon points="12 17.8 5 13.7 12 22.5 19 13.7" fill="#8fa2f2"/>';
    else if (id === 'sol') s = '<polygon points="7 4.5 21 4.5 17.5 8.5 3.5 8.5" fill="#9945ff"/><polygon points="3.5 10.2 17.5 10.2 21 14.2 7 14.2" fill="#43b4ca"/><polygon points="7 15.9 21 15.9 17.5 19.9 3.5 19.9" fill="#14f195"/>';
    if (!s) return '';
    return '<span class="emb' + (flag ? ' flag' : '') + '" aria-hidden="true"><svg viewBox="0 0 ' + (flag ? '30 20' : '24 24') + '">' + s
      + (flag ? '<rect x=".3" y=".3" width="29.4" height="19.4" fill="none" stroke="#000" stroke-opacity=".18" stroke-width=".6"/>' : '') + '</svg></span>';
  }

  /* Mean of the last 7 daily points against the mean of the first 7 of
     the year's line: the 7-day-average tiles' yearly change. */
  function avg7Change(s) {
    if (!Array.isArray(s) || s.length < 14) return null;
    var m = function (a) { var v = a.filter(function (x) { return typeof x === 'number' && isFinite(x); }); return v.length ? v.reduce(function (t, x) { return t + x; }, 0) / v.length : null; };
    var past = m(s.slice(0, 7)), now = m(s.slice(-7));
    return past ? (now / past - 1) * 100 : null;
  }

  /* ── One tile for the chosen period ── */
  function windowOf(it, cell, days) {
    var s = Array.isArray(it.s) ? it.s : [];
    if (cell.monthly) {
      if (days === 365) return { c: it.c365, s: s, l: T.win[365] };
      return { c: it.c1m, s: s, l: T.win.m1 };   /* a monthly figure has no week */
    }
    if (days === 7) return { c: it.c7, s: it.n7 >= 2 ? s.slice(-it.n7) : null, l: T.win[7] };
    if (days === 30) return { c: it.c30, s: it.n30 >= 2 ? s.slice(-it.n30) : null, l: T.win[30] };
    return { c: it.c365, s: s, l: T.win[365] };
  }
  function tile(cell, W, N) {
    var it = W[cell.id];
    var v = null, unit = cell.u || '', w;
    if (cell.net && N && N[cell.net[0]] != null) {
      /* On-chain: the 7-day averages headline, as on the site. */
      /* Same rules as the site (js/data-loaders.js _bfNetCell, 2026-10-05):
         the year's line fills in where network_data has none (stablecoins),
         and a 7-day-average tile's yearly change compares 7-day means. */
      var ns = (N.series || {})[cell.net[0]], ys = it && Array.isArray(it.s) ? it.s : null;
      v = fmt(N[cell.net[0]], cell.kind);
      if (PERIOD === 7) w = { c: N[cell.net[1]], s: Array.isArray(ns) ? ((N.n7 || {})[cell.net[0]] >= 3 ? ns.slice(-(N.n7 || {})[cell.net[0]]) : ns) : (ys && it.n7 >= 2 ? ys.slice(-it.n7) : null), l: T.win[7] };
      else if (PERIOD === 30) w = { c: (N.p30 || {})[cell.net[0]], s: Array.isArray(ns) ? ns : (ys && it.n30 >= 2 ? ys.slice(-it.n30) : null), l: T.win[30] };
      else if (it) { w = windowOf(it, cell, 365); if (cell.avg7) w.c = avg7Change(ys); }
      else w = { c: null, s: null, l: T.win[365] };
    } else {
      if (!it || it.v == null) return '';
      var si = MK && cell.mk ? cell.mk : null;
      v = fmt(si ? it.v * si.mul : it.v, si ? (si.kind || cell.kind) : cell.kind);
      if (si) unit = si.u;
      w = windowOf(it, cell, PERIOD);
    }
    if (v == null) return '';
    var copy = COPY[cell.k] || [cell.k, '', ''];
    var title = MK ? copy[0] : cell.k, desc = MK ? copy[2] : copy[1];
    var src = SRC[cell.src], when = it ? day(it.date, cell.monthly) : '';
    var extra = '';
    if (cell.range && it && it.lo != null) extra = '<div class="src">' + (MK ? 'цел ' : 'target ') + dec(it.lo.toFixed(2)) + '–' + dec(it.hi.toFixed(2)) + '%</div>';
    return '<div class="tile">' + emblem(cell.emb)
      + '<div class="k">' + esc(title) + '</div>'
      + '<div class="v">' + v + '<span class="u">' + esc(unit) + '</span></div>'
      + change(w.c, w.l, cell.kind === 'rate', !!cell.usdpts) + extra
      + spark(w.s, w.c == null || w.c >= 0)
      + '<div class="note">' + esc(desc) + '</div>'
      + '<div class="src">' + T.source + ': <a href="' + src[1] + (cell.sym ? encodeURIComponent(cell.sym) : '') + '" target="_blank" rel="noopener">' + esc(src[0]) + '</a>' + (when ? ' · ' + when : '') + '</div>'
      + '</div>';
  }

  var DATA = null;
  function render() {
    var host = document.getElementById('body');
    if (!DATA) return;
    var W = (DATA.world && DATA.world.items) || {}, N = DATA.net || null, html = '';
    GROUPS.forEach(function (g) {
      var cells = g.cells.map(function (c) { return tile(c, W, N); }).filter(Boolean);
      if (!cells.length) return;
      html += '<div class="grp">' + esc(MK ? g.mk : g.en) + '</div><div class="grid">' + cells.join('') + '</div>';
    });
    host.innerHTML = html || '<div class="msg">' + T.failed + '</div>';
    var seg = document.getElementById('seg');
    seg.innerHTML = [7, 30, 365].map(function (d) { return '<button type="button" data-d="' + d + '" class="' + (d === PERIOD ? 'on' : '') + '">' + T.seg[d] + '</button>'; }).join('');
    var ages = [DATA.worldAt, DATA.netAt].filter(Boolean).map(function (t) { return Date.now() - Date.parse(t); });
    var age = ages.length ? Math.min.apply(null, ages) / 3600000 : null;
    var ageTxt = age == null ? '' : age < 1.5 ? T.now : age < 36 ? (MK ? T.ago + ' ' + Math.round(age) + T.h : Math.round(age) + T.h) : (MK ? T.ago + ' ' + Math.round(age / 24) + T.d : Math.round(age / 24) + T.d);
    document.getElementById('t-meta').innerHTML = (ageTxt ? T.updated + ' ' + ageTxt + ' · ' : '') + T.note;
    postHeight();
  }

  function postHeight() {
    try { window.parent.postMessage({ rotatorEmbedHeight: Math.ceil(document.documentElement.scrollHeight) }, '*'); } catch (e) {}
  }

  document.getElementById('t-title').textContent = T.title;
  document.getElementById('t-sub').textContent = T.sub;
  document.getElementById('t-loading').textContent = T.loading;
  document.getElementById('t-open').textContent = T.open;
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-d]'); if (!b) return;
    PERIOD = +b.getAttribute('data-d'); render();
  });
  window.addEventListener('resize', postHeight);

  function row(key) {
    return fetch(URL_ + '?cache_key=eq.' + key + '&select=updated_at,data', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) { return rows && rows[0] ? rows[0] : null; })
      .catch(function () { return null; });
  }
  Promise.all([row('world_data'), row('network_data')]).then(function (r) {
    var w = r[0], n = r[1];
    if (!w && !n) { document.getElementById('body').innerHTML = '<div class="msg">' + T.failed + '</div>'; postHeight(); return; }
    DATA = { world: w && w.data, worldAt: w && w.updated_at, net: n && n.data, netAt: n && n.updated_at };
    render();
  });
})();
</script>
